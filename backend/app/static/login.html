<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="utf-8"/><title>闸对登录</title></head>
<body>
  <h1>闸对登录</h1>
  <form method="get" action="/">
    <label>账号 <input name="user" value="admin" autocomplete="username"/></label>
    <label>密码 <input name="password" type="password" value="123456" autocomplete="current-password"/></label>
    <button type="submit">登录</button>
  </form>
  <p>默认账号 admin / 密码 123456</p>
</body>
</html>
